[project]
name = "order-inventory-processing"
version = "0.1.0"
description = "Python L2 Evaluation Assignment: Real-Time Order & Inventory Processing Service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
]
